name: Build huggingface Image

on:
  push:
    branches: [ hug ]
    paths:
      - 'Dockerfile'
      - 'index.js'
      - 'package.json'
      - 'index.html'
  pull_request:
    branches: [ hug ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: hug 

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hugws:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=http server
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ... 前面部分保持不变 ...

- name: Extract metadata (tags, labels) for Docker
  id: meta
  uses: docker/metadata-action@v5   # 建议用最新版本 v5
  with:
    images: |
      ghcr.io/${{ github.repository }}
    # 可选：如果你想自定义 tags，可以在这里加
    tags: |
      type=raw,value=latest,enable={{ is_default_branch }}
      type=sha,prefix=sha-

# 然后在 build-push 步骤中使用它生成的 tags
- name: Build and push Docker image
  uses: docker/build-push-action@v6   # 也建议更新到最新版本
  with:
    context: .
    file: ./Dockerfile   # 你的 Dockerfile 路径
    push: true
    tags: ${{ steps.meta.outputs.tags }}
    labels: ${{ steps.meta.outputs.labels }}
    # 其他你需要的参数，比如 platforms, cache-from 等
